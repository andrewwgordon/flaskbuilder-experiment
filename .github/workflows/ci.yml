name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-flask pytest-cov
          pip install -r reqman/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check reqman/

      - name: Run Pytest Test Suite
        run: |
          cd reqman
          pytest --cov=app
